name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（platform-tools / build-tools / platforms 若干），
      # 不用 setup-android 去下载 cmdline-tools（那一步在 runner 上会失败），缺什么补什么
      - name: Ensure Android platform 34
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID SDK = $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            echo "sdkmanager = $SDKM"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          fi

      # runner 在海外：把国内镜像换成官方源，避免 130MB 发行包拉取超时
      - name: Use official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle#https://services.gradle.org/distributions#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Prefer official Maven repos
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle
          cat settings.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NAME="SkipAd-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp "$SRC" "dist/$NAME"
          echo "APK=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkipAd-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # 打 v* 标签时自动发 Release，APK 可直接下载安装，不用登录
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
