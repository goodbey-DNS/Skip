name: Build APK

on:
  # 只在打 tag 时构建。原来 push main 也触发一次，等于每次发版跑两遍：
  # main 那次只上传 artifact（没人下载），tag 那次才发 Release。
  # 日常编译自检改到本地（scripts/build-local.ps1），几秒到一分钟出包，
  # CI 只负责「跑单测 + 验签 + 发布」这三件本地做不了的事。
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 钉死 24.04：ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26，
    # 这次迁移会换掉预装的 JDK/SDK 版本组合，钉版本避免构建环境被动变化
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # 全部 Action 用 node24 版本：node20 已于 2026 年停用，旧版会在日志里刷 deprecation 提示
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 自带 Android SDK（platform-tools / build-tools / platforms 若干），
      # 不用 setup-android 去下载 cmdline-tools（那一步在 runner 上会失败），缺什么补什么
      - name: Ensure Android platform 36
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID SDK = $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-36" ]; then
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            echo "sdkmanager = $SDKM"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0"
          fi

      # runner 在海外：把国内镜像换成官方源，避免 130MB 发行包拉取超时
      - name: Use official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle#https://services.gradle.org/distributions#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Prefer official Maven repos
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle
          cat settings.gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_B64 未配置，本次会用随机 debug 签名"
          else
            echo "$KEYSTORE_B64" | base64 -d > ci-keystore.jks
            ls -l ci-keystore.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        # 缓存是尽力而为：GitHub 缓存服务偶发 5xx 时只该影响构建速度，不该把整次任务标红
        continue-on-error: true
        with:
          cache-cleanup: 'on-success'

      # 单测放在出包之前：纯逻辑（viewId 判定、文本长度闸）跑不过就没必要出包。
      # 任务名是 testDebugUnitTest——本项目只配置了 debug 单测变体，
      # testReleaseUnitTest 不存在，写错会直接报任务找不到（0.17.35 首轮就是这么挂的）。
      # 本机 JDK 在含中文的目录下，Gradle 起测试 worker 会 classpath 断裂，
      # 所以本地只做编译自检，测试统一交给 CI
      - name: Unit tests
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --no-daemon > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo '### 单元测试失败'
              echo '```'
              tail -n 80 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 出包必须是「已签名 + 不可调试」。以前出的是 assembleDebug，
      # android:debuggable=true，拿到手机的人可以 run-as 读私有数据、attach 调试器改内存；
      # 对一个常驻无障碍服务的 App 来说这不是可以留的口子。
      - name: Verify APK is signed and not debuggable
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$SRC"
          APKSH=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSH" verify --print-certs "$SRC" | grep -i 'SHA-256'
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::KEYSTORE_B64 未配置，release 包没有签名，停止发布"
            exit 1
          fi
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)
          if "$AAPT" dump badging "$SRC" | grep -q 'application-debuggable'; then
            echo "::error::产物仍是 debuggable，停止发布"
            exit 1
          fi
          echo "OK: 已签名，非 debuggable"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NAME="daxiaojie-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp "$SRC" "dist/$NAME"
          echo "APK=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: daxiaojie-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # 推 tag（v*）即自动发 Release：APK 可匿名直接下载，不用登录、不用翻 Actions
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: 大小姐 ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
