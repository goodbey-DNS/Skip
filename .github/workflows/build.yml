name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 全部 Action 用 node24 版本：node20 已于 2026 年停用，旧版会在日志里刷 deprecation 提示
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（platform-tools / build-tools / platforms 若干），
      # 不用 setup-android 去下载 cmdline-tools（那一步在 runner 上会失败），缺什么补什么
      - name: Ensure Android platform 34
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID SDK = $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          if [ ! -d "$SDK/platforms/android-34" ]; then
            SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            echo "sdkmanager = $SDKM"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          fi

      # runner 在海外：把国内镜像换成官方源，避免 130MB 发行包拉取超时
      - name: Use official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle#https://services.gradle.org/distributions#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Prefer official Maven repos
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle
          cat settings.gradle

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_B64 未配置，本次会用随机 debug 签名"
          else
            echo "$KEYSTORE_B64" | base64 -d > ci-keystore.jks
            ls -l ci-keystore.jks
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        # 缓存是尽力而为：GitHub 缓存服务偶发 5xx 时只该影响构建速度，不该把整次任务标红
        continue-on-error: true
        with:
          cache-cleanup: 'on-success'

      - name: Build debug APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APKSH=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$APKSH" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i 'SHA-256' || true

      - name: Rename APK with version
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          NAME="SkipAd-${{ github.ref_name }}-${{ github.run_number }}.apk"
          cp "$SRC" "dist/$NAME"
          echo "APK=dist/$NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkipAd-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      # 打 v* 标签时自动发 Release，APK 可直接下载安装，不用登录
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
