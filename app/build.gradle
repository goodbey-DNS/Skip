plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noteatoranges.skipad'
    // compileSdk 36锛氳窡闅?AGP 瑕佹眰锛泃argetSdk 鍘嬪湪 34锛岄伩鍏嶆柊绯荤粺琛屼负锛堝墠鍙版湇鍔＄被鍨嬨€?    // 鍚庡彴璋冨害闄愬埗锛夊湪娌￠獙璇佽繃鐨勫墠鎻愪笅琚姩鐢熸晥
    compileSdk 36

    defaultConfig {
        applicationId "com.noteatoranges.skipad"
        minSdk 26
        targetSdk 34
        versionCode 155
        versionName "0.17.83"
    }

    // 绛惧悕鏉ヨ嚜 CI 鐨?GitHub Secrets锛圞EYSTORE_B64 / KEYSTORE_PASSWORD锛夛紝
    // 鏈湴娌℃湁杩欎袱涓幆澧冨彉閲忔椂涓嶅仛浠讳綍绛惧悕閰嶇疆锛屼氦缁?Gradle 榛樿琛屼负
    // 鈥斺€斿洜姝ゆ湰鍦版瀯寤哄嚭鐨勫寘鍜?CI 鍑虹殑鍖呯鍚嶄笉鍚岋紝涓嶈兘浜掔浉瑕嗙洊瀹夎
    def ciStoreB64 = System.getenv("KEYSTORE_B64")
    def ciStorePwd = System.getenv("KEYSTORE_PASSWORD")

    signingConfigs {
        ci {
            if (ciStoreB64 && ciStorePwd) {
                storeFile file("${rootDir}/ci-keystore.jks")
                storePassword ciStorePwd
                keyAlias "skipad"
                keyPassword ciStorePwd
            }
        }
    }

    buildTypes {
        debug {
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
        release {
            // 涓嶅紑鍚贩娣嗭細鏈」鐩浂绗笁鏂?SDK锛屼唬鐮侀噺灏忥紝娣锋穯鏀剁泭浣庯紱
            // 淇濈暀绗﹀彿渚夸簬鑷繁鐪嬪爢鏍?            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // release 蹇呴』涓嶅彲璋冭瘯锛歞ebuggable=true 鏃舵嬁鍒版墜鏈虹殑浜哄彲浠?run-as 璇荤鏈夋暟鎹€?            // attach 璋冭瘯鍣ㄦ敼鍐呭瓨銆傚涓€涓父椹绘棤闅滅鏈嶅姟鐨?App 鏉ヨ杩欎笉鏄兘鐣欑殑鍙ｅ瓙锛?            // CI 閲岃繕鏈変竴姝?apksigner/aapt2 鏍￠獙锛屼骇鐗╁彲璋冭瘯浼氱洿鎺ヨ鍙戝竷澶辫触
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 杩欎袱鏉￠兘鏄埢鎰忛€夋嫨锛屼笉鏄緟鍔烇細
        // - OldTargetApi锛歵argetSdk 鍘嬪湪 34锛岄伩鍏嶆柊绯荤粺鐨勫墠鍙版湇鍔＄被鍨?鍚庡彴璋冨害闄愬埗
        //   鍦ㄦ病鍋氳繃鐪熸満楠岃瘉鐨勫墠鎻愪笅琚姩鐢熸晥锛堣鏂囦欢椤堕儴娉ㄩ噴锛夛紱
        // - GradleDependency锛氭彁绀虹殑 compileSdk 37 涓?core-ktx 1.19 鏄悓涓€涓墠鎻愶紝
        //   鍗?compileSdk 瑕佽繛甯﹂噸娴嬫暣鏉¤惤鍦伴摼璺紝绛夋湁璁惧绐楀彛鍐嶅仛銆?        // 鍏朵綑璀﹀憡鐓у父鎶ワ紝涓嶇敤 baseline 鏁翠綋鍘嬫帀鈥斺€斾互鍚庢柊澧炵殑闂杩樿鐪嬪緱瑙併€?        // ObsoleteSdkInt锛歮ipmap-anydpi-v26 杩欎釜 -v26 鍚庣紑涓嶈兘鍘绘帀鈥斺€旇嚜閫傚簲鍥炬爣
        // 鐨勮祫婧愰檺瀹氱涓€鏃﹀垹鎺夛紝AAPT 浼氭姤 resource mipmap/ic_launcher not found
        // 锛?.17.79 璇曡繃锛屽洖閫€浜嗭級銆俵int 璁や负 minSdk 26 鏃跺畠澶氫綑锛屽疄闄呬笉鏄€?        disable += ['OldTargetApi', 'GradleDependency', 'ObsoleteSdkInt']

        // 0.17.82 璧?warning 涔熷綋閿欒锛氳繖涓€鐗堝垰鎶?109 鏉℃竻鍒?0锛屼笉璁鹃椄闂ㄧ殑璇?        // 杩囦袱涓湀鍙堜細鎱㈡參闀垮洖鏉ャ€侰I 鐨?lintRelease 姝ラ浼氭妸杩欓噷鐨勭粨鏋滅洿鎺ュ彉鎴愮孩鍙夈€?        // 鐪熼亣鍒般€岃涔堝崌绾т緷璧栥€佽涔堟敼浜у搧琛屼负銆嶇殑鍛婅锛屾寜涓婇潰 disable 鐨勬柟寮忛€愭潯璇存槑鐞嗙敱锛?        // 涓嶈鐢?baseline 鏁翠綋鍘嬫帀鈥斺€旈偅绉嶅仛娉曠瓑浜庢妸鏂伴棶棰樹篃涓€璧疯棌璧锋潵銆?        warningsAsErrors = true
    }
}

// Kotlin 2.x 宸茬Щ闄?kotlinOptions锛岀粺涓€鐢?compilerOptions
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // 渚濊禆鍒绘剰鍘嬪埌鏈€灏忥細涓嶅紩 material / compose锛岀晫闈㈢敤鍘熺敓 View 鎷?    // 2026-11-07 鍗囩骇锛歝ore 1.12.0鈫?.19.1銆乤ppcompat 1.6.1鈫?.8.0銆?    // 鍗囩骇鍓嶇暀涓彴闃讹細appcompat 1.7 璧峰涓婚/edge-to-edge 鏈夎涓哄彉鍖栵紝
    // 鏈」鐩槸鎵嬪啓 Ui.edgeToEdge锛岃嫢 UI 鍑洪棶棰樺厛鍥為€€杩欎袱琛屽啀鎺掓煡銆?    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    // 鍙粰銆岀函閫昏緫銆嶅崟娴嬬敤锛歷iewId 鍒ゅ畾銆佹枃鏈暱搴﹂椄銆備笉寮?robolectric锛?    // 涓嶄吉閫?AccessibilityNodeInfo鈥斺€旈渶瑕?Android 杩愯鏃剁殑涓滆タ涓€寰嬩笉娴嬶紝涔熶笉涓烘祴璇曟敼缁撴瀯
    testImplementation 'junit:junit:4.13.2'
}
