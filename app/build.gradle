plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noteatoranges.skipad'
    // 36?AGP 9.x ????????????????? API ? 31?targetSdk ?? 34
    compileSdk 36

    defaultConfig {
        applicationId "com.noteatoranges.skipad"
        minSdk 26
        targetSdk 34
        versionCode 92
        versionName "0.17.20"
    }

    // ?????CI ? GitHub Secrets ?? keystore ??????????
    // ?????????????????????????????
    // ???????????? signingConfig ????????? debug ???
    def ciStoreB64 = System.getenv("KEYSTORE_B64")
    def ciStorePwd = System.getenv("KEYSTORE_PASSWORD")

    signingConfigs {
        ci {
            if (ciStoreB64 && ciStorePwd) {
                storeFile file("${rootDir}/ci-keystore.jks")
                storePassword ciStorePwd
                keyAlias "skipad"
                keyPassword ciStorePwd
            }
        }
    }

    buildTypes {
        debug {
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
        release {
            // ??????????????????/?????????????????
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ????? release?debug ?? android:debuggable=true??????
            // run-as ??????attach ???????CI ? release ?????? debug ???
            // keystore??????????
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 2.x ? compilerOptions??? kotlinOptions ????
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // M1 ???????????? material/compose?????????
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
