plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noteatoranges.skipad'
    // compileSdk 36：跟随 AGP 要求；targetSdk 压在 34，避免新系统行为（前台服务类型、
    // 后台调度限制）在没验证过的前提下被动生效
    compileSdk 36

    defaultConfig {
        applicationId "com.noteatoranges.skipad"
        minSdk 26
        targetSdk 34
        versionCode 136
        versionName "0.17.64"
    }

    // 签名来自 CI 的 GitHub Secrets（KEYSTORE_B64 / KEYSTORE_PASSWORD），
    // 本地没有这两个环境变量时不做任何签名配置，交给 Gradle 默认行为
    // ——因此本地构建出的包和 CI 出的包签名不同，不能互相覆盖安装
    def ciStoreB64 = System.getenv("KEYSTORE_B64")
    def ciStorePwd = System.getenv("KEYSTORE_PASSWORD")

    signingConfigs {
        ci {
            if (ciStoreB64 && ciStorePwd) {
                storeFile file("${rootDir}/ci-keystore.jks")
                storePassword ciStorePwd
                keyAlias "skipad"
                keyPassword ciStorePwd
            }
        }
    }

    buildTypes {
        debug {
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
        release {
            // 不开启混淆：本项目零第三方 SDK，代码量小，混淆收益低；
            // 保留符号便于自己看堆栈
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // release 必须不可调试：debuggable=true 时拿到手机的人可以 run-as 读私有数据、
            // attach 调试器改内存。对一个常驻无障碍服务的 App 来说这不是能留的口子，
            // CI 里还有一步 apksigner/aapt2 校验，产物可调试会直接让发布失败
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 2.x 已移除 kotlinOptions，统一用 compilerOptions
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // 依赖刻意压到最小：不引 material / compose，界面用原生 View 拼
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // 只给「纯逻辑」单测用：viewId 判定、文本长度闸。不引 robolectric，
    // 不伪造 AccessibilityNodeInfo——需要 Android 运行时的东西一律不测，也不为测试改结构
    testImplementation 'junit:junit:4.13.2'
}
