plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.noteatoranges.skipad'
    // 34：工程实际用到的最高 API 是 31（blurBehindRadius / isAccessibilityTool），
    // 34 是 AGP 8.2.2 原生支持的上限，云端 CI 无需额外装预览版 platform
    compileSdk 34

    defaultConfig {
        applicationId "com.noteatoranges.skipad"
        minSdk 26
        targetSdk 34
        versionCode 32
        versionName "0.9.3"
    }

    // 固定签名：CI 从 GitHub Secrets 还原 keystore 后设这两个环境变量，
    // 保证每次构建出来的包签名一致，可以直接覆盖安装，不用卸载。
    // 本地没有这两个变量时这个 signingConfig 是空的，走系统默认 debug 签名。
    def ciStoreB64 = System.getenv("KEYSTORE_B64")
    def ciStorePwd = System.getenv("KEYSTORE_PASSWORD")

    signingConfigs {
        ci {
            if (ciStoreB64 && ciStorePwd) {
                storeFile file("${rootDir}/ci-keystore.jks")
                storePassword ciStorePwd
                keyAlias "skipad"
                keyPassword ciStorePwd
            }
        }
    }

    buildTypes {
        debug {
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ciStoreB64 && ciStorePwd) signingConfig signingConfigs.ci
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // M1 刻意保持最小依赖：不引入 material/compose，减小体积与攻击面
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
